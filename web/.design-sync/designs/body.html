document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

c\"><\u002Fscript>\n<style>\n:root{--s:Archivo,system-ui,sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace;--color-bg:#bcc5dd}\nhtml body{margin:0;background:#bcc5dd;font-weight:500}\na{color:#0a7093;text-decoration:none}\na:hover{color:#075a76}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<section style=\"padding:44px 48px 90px;font-family:var(--s);box-sizing:border-box\">\n  <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:6px\">\n    <span style=\"font:700 10.5px var(--m);padding:3px 7px;background:#0a7093;color:#ffffff;border-radius:5px\">PROPOSED<\u002Fspan>\n    <span style=\"font-size:20px;font-weight:700;letter-spacing:-0.3px;color:#1c1e2a\">Body · what the readings actually support<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"max-width:900px;font-size:13px;font-weight:500;line-height:1.6;color:#3f4457;margin-bottom:30px\">The last destination. Readiness is a single number built from three readings that arrive at very different rates — RHR most days, HRV rarely. This screen shows the score, then what it was scored on, and never dresses a population default as your own average.<\u002Fdiv>\n\n  <div style=\"display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap\">\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;flex:none\">\n      <div style=\"display:flex;align-items:baseline;gap:9px\">\n        <span style=\"font:700 10.5px var(--m);padding:3px 7px;background:#0a7093;color:#ffffff;border-radius:5px\">A<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:700;color:#1c1e2a\">Body · scroll for trends<\u002Fspan>\n      <\u002Fdiv>\n\n      <div data-screen-label=\"Body — recovery\" style=\"width:390px;height:844px;background:#bcc5dd;border:1px solid #a8b1cc;border-radius:24px;overflow:hidden;position:relative\">\n        <div style=\"height:100%;overflow:auto;scrollbar-width:none;padding:0 0 92px;box-sizing:border-box\">\n\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:18px 16px 12px\">\n            <span style=\"font-size:22px;font-weight:700;letter-spacing:-0.4px;color:#1c1e2a\">Body<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:600;font-family:var(--m);color:#43485a\">Fri 19 Jun · synced 06:12<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"margin:0 12px 10px;background:#ffffff;border:1px solid #c8cee0;border-radius:12px;box-shadow:0 1px 2px #1c1e2a1a;padding:18px 20px;{{ readyRail }}\">\n            <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#43485a\">READINESS<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:12px;margin-top:6px\">\n              <span style=\"font-family:var(--m);font-size:56px;font-weight:700;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums;{{ readyStyle }}\">{{ score }}<\u002Fspan>\n              <div style=\"padding-bottom:6px\">\n                <div style=\"font-size:15px;font-weight:700;{{ readyStyle }}\">{{ status }}<\u002Fdiv>\n                <div style=\"font-size:12px;font-weight:600;color:#43485a\">{{ coaching }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #e4e7ef\">\n              <div style=\"font-size:9px;font-weight:700;letter-spacing:2px;color:#43485a;margin-bottom:8px\">WHAT TOOK IT OFF 100<\u002Fdiv>\n              <sc-for list=\"{{ deductions }}\" as=\"d\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:7px\">\n                  <span style=\"font-family:var(--m);font-size:13px;font-weight:700;width:34px;flex:none;color:#a34c1c;font-variant-numeric:tabular-nums\">{{ d.amount }}<\u002Fspan>\n                  <span style=\"font-size:12px;font-weight:500;color:#3f4457\">{{ d.reason }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"font-size:11.5px;font-weight:500;line-height:1.5;color:#43485a;margin-top:10px\">{{ partialNote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px 10px\">\n            <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"background:#ffffff;border:1px solid #c8cee0;border-radius:12px;box-shadow:0 1px 2px #1c1e2a1a;padding:14px 16px\">\n                <div style=\"font-size:9px;font-weight:700;letter-spacing:2px;color:#43485a\">{{ t.label }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:6px\">\n                  <span style=\"font-family:var(--m);font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;{{ t.valStyle }}\">{{ t.value }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;color:#43485a\">{{ t.unit }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;font-weight:600;color:#43485a;margin-top:6px\">{{ t.delta }}<\u002Fdiv>\n                <div style=\"font-size:10px;font-weight:600;margin-top:3px;{{ t.baseStyle }}\">{{ t.base }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin:0 12px 10px;background:#fdf6e0;border:1px solid #ecdcab;border-radius:12px;padding:13px 16px\">\n            <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#8a6a10;margin-bottom:6px\">BASELINE CONFIDENCE<\u002Fdiv>\n            <div style=\"font-size:12.5px;font-weight:500;line-height:1.55;color:#3f4457\">{{ baselineNote }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#43485a;margin:18px 16px 8px\">SLEEP · 14 DAYS<\u002Fdiv>\n          <div style=\"margin:0 12px 10px;background:#ffffff;border:1px solid #c8cee0;border-radius:12px;box-shadow:0 1px 2px #1c1e2a1a;padding:16px 18px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n              <div>\n                <div style=\"display:flex;align-items:baseline;gap:7px\">\n                  <span style=\"font-family:var(--m);font-size:26px;font-weight:700;line-height:1;color:#8a6a10;font-variant-numeric:tabular-nums\">6.6<\u002Fspan>\n                  <span style=\"font-size:12px;font-weight:700;color:#43485a\">h avg<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;font-weight:600;color:#43485a;margin-top:4px\">{{ sleepHeadline }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:12px;margin-top:16px\">\n              <div style=\"display:flex;flex-direction:column;justify-content:space-between;height:96px;flex:none;padding-bottom:14px\">\n                <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#646a80\">9h<\u002Fspan>\n                <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#10795a\">7h<\u002Fspan>\n                <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#646a80\">5h<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"position:relative;height:82px\">\n                  <div style=\"position:absolute;left:0;right:0;top:50%;border-top:1px dashed #9ed8be\"><\u002Fdiv>\n                  <div style=\"position:absolute;inset:0;display:flex;align-items:flex-end;gap:3px\">\n                    <sc-for list=\"{{ sleep }}\" as=\"b\" hint-placeholder-count=\"14\">\n                      <div style=\"flex:1;border-radius:2px 2px 0 0;{{ b.style }}\"><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;margin-top:6px\">\n                  <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#646a80\">6 Jun<\u002Fspan>\n                  <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#646a80\">19 Jun<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;font-weight:500;line-height:1.5;color:#43485a;margin-top:12px;padding-top:10px;border-top:1px solid #e4e7ef\">{{ sleepNote }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#43485a;margin:18px 16px 8px\">RESTING HR · 14 DAYS<\u002Fdiv>\n          <div style=\"margin:0 12px 10px;background:#ffffff;border:1px solid #c8cee0;border-radius:12px;box-shadow:0 1px 2px #1c1e2a1a;padding:16px 18px\">\n            <div style=\"display:flex;gap:12px\">\n              <div style=\"display:flex;flex-direction:column;justify-content:space-between;height:96px;flex:none;padding-bottom:14px\">\n                <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#646a80\">{{ rhrAxisHi }}<\u002Fspan>\n                <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#0a7093\">{{ rhrAxisMid }}<\u002Fspan>\n                <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#646a80\">{{ rhrAxisLo }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"position:relative;height:82px;background:#f6f7fb;border-radius:4px;overflow:hidden\">\n                  <div style=\"position:absolute;left:0;right:0;background:#d5ecf6;{{ bandStyle }}\"><\u002Fdiv>\n                  <div style=\"position:absolute;inset:0;display:flex;gap:3px;padding:0 2px\">\n                    <sc-for list=\"{{ rhr }}\" as=\"p\" hint-placeholder-count=\"14\">\n                      <div style=\"flex:1;{{ p.wrapStyle }}\">\n                        <div style=\"width:5px;height:5px;border-radius:50%;{{ p.dotStyle }}\"><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;justify-content:space-between;margin-top:6px\">\n                  <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#646a80\">6 Jun<\u002Fspan>\n                  <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#646a80\">19 Jun<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;font-weight:500;line-height:1.5;color:#43485a;margin-top:12px;padding-top:10px;border-top:1px solid #e4e7ef\">{{ rhrNote }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#43485a;margin:18px 16px 8px\">HRV · 14 DAYS<\u002Fdiv>\n          <div style=\"margin:0 12px 10px;background:#ffffff;border:1px solid #c8cee0;border-radius:12px;box-shadow:0 1px 2px #1c1e2a1a;padding:16px 18px\">\n            <div style=\"display:flex;gap:3px;align-items:flex-end;height:52px\">\n              <sc-for list=\"{{ hrv }}\" as=\"h\" hint-placeholder-count=\"14\">\n                <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px\">\n                  <div style=\"width:100%;border-radius:2px;{{ h.style }}\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;margin-top:6px\">\n              <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#646a80\">6 Jun<\u002Fspan>\n              <span style=\"font-family:var(--m);font-size:9px;font-weight:700;color:#646a80\">19 Jun<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;font-weight:500;line-height:1.5;color:#43485a;margin-top:12px;padding-top:10px;border-top:1px solid #e4e7ef\">{{ hrvNote }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#43485a;margin:18px 16px 8px\">NIGGLES<\u002Fdiv>\n          <div style=\"margin:0 12px 10px;background:#ffffff;border:1px solid #c8cee0;border-radius:12px;box-shadow:0 1px 2px #1c1e2a1a;padding:14px 16px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n              <span style=\"font-size:14px;font-weight:700;color:#1c1e2a\">Right shoulder<\u002Fspan>\n              <span style=\"font-family:var(--m);font-size:10px;font-weight:700;color:#a3407a\">WATCHING<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;font-weight:500;line-height:1.55;color:#3f4457;margin-top:6px\">Carries the L/R asymmetry. Plank is prescribed with forearms pressed down for this reason, and pressing volume stays capped until it is quiet for a full home week.<\u002Fdiv>\n            <div style=\"font-size:11px;font-weight:600;color:#43485a;margin-top:8px;padding-top:8px;border-top:1px solid #e4e7ef\">Last flagged 4 days ago · no session missed<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:11px;font-weight:500;line-height:1.55;color:#43485a;margin:14px 16px 0\">Vitals sync from Google Health each morning. A missing reading is left missing — it is never counted as a zero.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:absolute;bottom:0;left:0;right:0;z-index:100;height:64px;display:flex;background:#ffffff;border-top:1px solid #c8cee0;box-shadow:0 -1px 8px #1c1e2a0f\">\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer\">\n            <div style=\"width:18px;height:18px;border-radius:5px;border:2px solid #646a80\"><\u002Fdiv>\n            <span style=\"font-size:10px;font-weight:600;color:#646a80\">Today<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer\">\n            <div style=\"width:18px;height:18px;border-radius:50%;border:2px solid #646a80\"><\u002Fdiv>\n            <span style=\"font-size:10px;font-weight:600;color:#646a80\">Train<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer\">\n            <div style=\"width:18px;height:18px;border-left:2px solid #646a80;border-bottom:2px solid #646a80\"><\u002Fdiv>\n            <span style=\"font-size:10px;font-weight:600;color:#646a80\">Progress<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer\">\n            <div style=\"width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #0a7093\"><\u002Fdiv>\n            <span style=\"font-size:10px;font-weight:700;color:#0a7093\">Body<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer\">\n            <div style=\"width:18px;height:16px;border-radius:5px 5px 5px 1px;border:2px solid #646a80\"><\u002Fdiv>\n            <span style=\"font-size:10px;font-weight:600;color:#646a80\">Coach<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:390px;font-size:11.5px;font-weight:500;line-height:1.6;color:#3f4457\">The score comes first, but it is followed immediately by its own arithmetic — the two deductions that produced it, and a note saying which readings were missing when it was calculated.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;flex:none;width:390px\">\n      <div style=\"display:flex;align-items:baseline;gap:9px\">\n        <span style=\"font:700 10.5px var(--m);padding:3px 7px;background:#5f45b0;color:#ffffff;border-radius:5px\">B<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:700;color:#1c1e2a\">Decisions taken<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"background:#ffffff;border:1px solid #c8cee0;border-left:3px solid #a34c1c;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#a34c1c;margin-bottom:10px\">A BUG THIS DESIGN FIXES<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:500;line-height:1.6;color:#3f4457\">`computePersonalBaselines` deliberately reports confidence per metric — RHR has 17 days of the last 30, HRV has 6 — and the source comment says why: one shared flag lets a view label a population default as \"your avg\". The current mobile recovery view uses exactly one shared flag. Here each tile carries its own label, and HRV says plainly that 30ms is a population number.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#ffffff;border:1px solid #c8cee0;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#43485a;margin-bottom:10px\">HRV IS DRAWN AS GAPS<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:500;line-height:1.6;color:#3f4457\">The existing chart uses `connectNulls`, which draws a continuous line through eight days that were never measured. Six readings in fourteen days is the real picture, so the chart shows six bars and eight blanks. A sparse signal should look sparse.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#ffffff;border:1px solid #c8cee0;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#43485a;margin-bottom:10px\">THE SCORE SHOWS ITS WORKING<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:500;line-height:1.6;color:#3f4457\">Readiness is deductions off 100. Showing the two that fired turns an opaque 72 into something you can disagree with — and both are recomputed here, not typed.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#ffffff;border:1px solid #c8cee0;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#43485a;margin-bottom:10px\">CONSISTENT WITH COACH<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:500;line-height:1.6;color:#3f4457\">Readiness 72, sleep 6.4h and RHR 60 are the same readings Coach cites when it explains today's PROCEED. The two screens share one set of numbers or neither can be trusted.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fdf6e0;border:1px solid #ecdcab;border-radius:12px;padding:18px 20px\">\n        <div style=\"font-size:9px;font-weight:700;letter-spacing:3px;color:#8a6a10;margin-bottom:10px\">NOT DRAWN<\u002Fdiv>\n        <div style=\"font-size:12.5px;font-weight:500;line-height:1.6;color:#3f4457\">The NO DATA state — `computeReadiness` returns a null score when RHR is missing, and this screen assumes it arrived. Same family as the load pending and unavailable states in flight elsewhere.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:920,&quot;height&quot;:1100}}\">\n// Readings for Fri 19 Jun. Same set Coach cites for today's call.\nconst LATEST = { rhr: 60, hrv: null, sleep: 6.4 };\nconst TSB = -8.9;\n\n// computePersonalBaselines: personal when a metric has >= 14 of the last 28 days.\nconst COVERAGE = { rhr: 17, hrv: 6 };\nconst RHR_DEFAULT = 57, HRV_DEFAULT = 30, SLEEP_TARGET = 7;\nconst RHR_BASE = 54.2, HRV_BASE = HRV_DEFAULT;\n\nconst SLEEP_14 = [7.2, 6.8, 5.9, 7.4, 6.1, 6.6, 8.0, 6.9, 5.4, 7.1, 6.3, 7.6, 6.0, 6.4];\nconst RHR_14 = [53, 54, 56, 53, 55, 54, 52, 55, 58, 54, 56, 57, 59, 60];\nconst HRV_14 = [null, 34, null, null, 29, null, 31, null, null, 26, null, null, 28, null];\n\nclass Component extends DCLogic {\n  renderVals() {\n    const rhrPersonal = COVERAGE.rhr >= 14;\n    const hrvPersonal = COVERAGE.hrv >= 14;\n\n    // computeReadiness: deductions off a 100 ceiling.\n    const dRhr = Math.max(0, LATEST.rhr - RHR_BASE) * 4;\n    const dHrv = LATEST.hrv != null ? Math.max(0, HRV_BASE - LATEST.hrv) * 1.5 : 0;\n    const dSleep = LATEST.sleep != null && LATEST.sleep < SLEEP_TARGET\n      ? (SLEEP_TARGET - LATEST.sleep) * 8 : 0;\n    const dTsb = TSB < -20 ? (Math.abs(TSB) - 20) * 0.8 : 0;\n    const score = Math.round(Math.min(100, Math.max(0, 100 - dRhr - dHrv - dSleep - dTsb)));\n\n    const status = score >= 80 ? 'READY' : score >= 60 ? 'CAUTION' : 'FATIGUED';\n    const tone = score >= 80 ? '#10795a' : score >= 60 ? '#8a6a10' : '#a32040';\n    const coaching = score >= 80 ? 'Train as planned'\n      : score >= 60 ? 'Train but monitor closely' : 'Prioritise recovery today';\n\n    const round1 = n => Math.round(n * 10) / 10;\n    const deductions = [\n      { d: dRhr, reason: 'RHR ' + LATEST.rhr + ' against your ' + RHR_BASE + ' average — ' + round1(LATEST.rhr - RHR_BASE) + ' over' },\n      { d: dSleep, reason: 'Sleep ' + LATEST.sleep + 'h against the 7h floor' },\n      { d: dHrv, reason: 'HRV below baseline' },\n      { d: dTsb, reason: 'Form below −20' },\n    ].filter(x => x.d > 0).map(x => ({ amount: '−' + round1(x.d), reason: x.reason }));\n\n    const missing = [];\n    if (LATEST.hrv == null) missing.push('HRV');\n    if (LATEST.sleep == null) missing.push('sleep');\n    const partialNote = missing.length\n      ? 'Scored without ' + missing.join(' and ') + ' — no reading arrived today, so that term was skipped rather than assumed.'\n      : 'Every reading arrived today.';\n\n    const rhrDelta = round1(LATEST.rhr - RHR_BASE);\n    const rhrTone = rhrDelta > 5 ? '#a32040' : rhrDelta > 2 ? '#8a6a10' : '#10795a';\n    const sleepTone = LATEST.sleep >= 7 ? '#10795a' : LATEST.sleep >= 6.5 ? '#8a6a10' : '#a34c1c';\n    const tsbTone = TSB > 10 ? '#10795a' : TSB > -10 ? '#8a6a10' : TSB > -30 ? '#a34c1c' : '#a32040';\n\n    const baseLabel = personal => personal ? 'your 28-day average' : 'population default';\n    const baseTone = personal => 'color:' + (personal ? '#43485a' : '#8a6a10');\n\n    const tiles = [\n      { label: 'RESTING HR', value: LATEST.rhr, unit: 'bpm',\n        valStyle: 'color:' + rhrTone,\n        delta: '+' + rhrDelta + ' vs ' + RHR_BASE,\n        base: baseLabel(rhrPersonal) + ' · ' + COVERAGE.rhr + '/28 days',\n        baseStyle: baseTone(rhrPersonal) },\n      { label: 'HRV', value: '—', unit: 'ms',\n        valStyle: 'color:#646a80',\n        delta: 'no reading today',\n        base: baseLabel(hrvPersonal) + ' · ' + COVERAGE.hrv + '/28 days',\n        baseStyle: baseTone(hrvPersonal) },\n      { label: 'SLEEP', value: LATEST.sleep, unit: 'h',\n        valStyle: 'color:' + sleepTone,\n        delta: round1(SLEEP_TARGET - LATEST.sleep) + 'h under target',\n        base: '7h floor · fixed', baseStyle: 'color:#43485a' },\n      { label: 'FORM', value: TSB, unit: '', valStyle: 'color:' + tsbTone,\n        delta: 'inside the normal band', base: 'from training load', baseStyle: 'color:#43485a' },\n    ];\n\n    const baselineNote = hrvPersonal\n      ? 'Both baselines are your own.'\n      : 'RHR has ' + COVERAGE.rhr + ' of the last 28 days, so ' + RHR_BASE + ' is genuinely your average. HRV has only ' + COVERAGE.hrv + ' — the ' + HRV_BASE + 'ms it compares against is a population default, not you. Wear the strap on more nights and that becomes real.';\n\n    const sleepAvg = round1(SLEEP_14.reduce((a, b) => a + b, 0) / SLEEP_14.length);\n    const under = SLEEP_14.filter(v => v < SLEEP_TARGET).length;\n    const sleep = SLEEP_14.map(v => {\n      const h = Math.round((v - 4) / 5 * 82);\n      return { style: 'height:' + h + 'px;background:' + (v >= SLEEP_TARGET ? '#9ed8be' : v >= 6.5 ? '#f0dc9a' : '#e8b79c') };\n    });\n\n    const rhrLo = 48, rhrHi = 62, TRACK = 82;\n    const yPx = v => (rhrHi - v) / (rhrHi - rhrLo) * TRACK;\n    const rhr = RHR_14.map((v, i) => {\n      const last = i === RHR_14.length - 1;\n      const d = last ? 7 : 5;\n      return {\n        wrapStyle: 'height:' + TRACK + 'px;position:relative',\n        dotStyle: 'position:absolute;left:50%;margin-left:' + (-d / 2) + 'px;top:' +\n          (yPx(v) - d / 2).toFixed(1) + 'px;width:' + d + 'px;height:' + d + 'px;background:' +\n          (last ? '#a32040' : '#0a7093'),\n      };\n    });\n    // Band derived from the same scale as the dots, not hand-set.\n    const bandTop = yPx(RHR_BASE + 2), bandH = yPx(RHR_BASE - 2) - bandTop;\n\n    const hrvSeen = HRV_14.filter(v => v != null);\n    const hrvHi = 40;\n    const hrv = HRV_14.map(v => ({\n      style: v == null\n        ? 'height:3px;background:#dde2ee'\n        : 'height:' + Math.round(v / hrvHi * 52) + 'px;background:' + (v >= HRV_BASE ? '#9ed8be' : '#e8b79c'),\n    }));\n\n    return {\n      score, status, coaching, deductions, partialNote, tiles, baselineNote,\n      readyStyle: 'color:' + tone,\n      readyRail: 'border-left:3px solid ' + tone,\n      sleep, rhr, hrv,\n      bandStyle: 'top:' + bandTop.toFixed(1) + 'px;height:' + bandH.toFixed(1) + 'px',\n      rhrAxisHi: rhrHi, rhrAxisMid: RHR_BASE, rhrAxisLo: rhrLo,\n      sleepHeadline: under + ' of 14 nights under the 7h floor',\n      sleepNote: 'Averaging ' + sleepAvg + 'h. The floor is the dashed line — it is the same 7h the readiness score deducts against, not a separate target.',\n      rhrNote: 'The band is ±2bpm around your ' + RHR_BASE + ' average. Today at ' + LATEST.rhr + ' is the highest reading in the window, and the last four days have trended up.',\n      hrvNote: hrvSeen.length + ' readings in 14 days — the blanks are nights with no measurement, left blank rather than interpolated. Too sparse to read a trend from.',\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
