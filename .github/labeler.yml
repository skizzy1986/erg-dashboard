# PR auto-labeler config (actions/labeler@v5). Maps changed paths to the area
# labels defined in .github/labels.yml. Labels must already exist (synced by
# .github/workflows/labels.yml).

testing:
  - changed-files:
      - any-glob-to-any-file:
          - '**/__tests__/**'
          - '**/*.test.{js,jsx}'

android:
  - changed-files:
      - any-glob-to-any-file:
          - 'web/android/**'
          - 'web/capacitor.config.json'

integration:
  - changed-files:
      - any-glob-to-any-file:
          - 'supabase/**'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

refactor:
  - changed-files:
      - any-glob-to-any-file:
          - 'web/src/App.jsx'
          - 'web/src/StrengthLogger.jsx'

# Note: the `docs` rule above also fires on docs in these paths. That is fine —
# a design doc is both, and both labels are useful on the board.
design:
  - changed-files:
      - any-glob-to-any-file:
          - 'DESIGN.md'
          - 'web/.design-sync/**'
          - 'web/src/constants/theme.js'
          - 'web/src/constants/ui.js'
          - 'web/src/utils/themeCss.js'
