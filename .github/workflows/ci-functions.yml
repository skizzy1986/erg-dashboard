name: CI — Edge Functions

# Same job-level path-filtering pattern as ci-web.yml, and for the same reason:
# workflow-level `on.paths` makes a required check report nothing and leaves the
# PR stuck on "Expected — waiting for status", whereas an `if:`-skipped job
# reports "skipped", which branch protection counts as passing.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect edge function changes
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            functions:
              - 'supabase/functions/**'
              - '.github/workflows/ci-functions.yml'

  test:
    name: Deno Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # `deno run`, not `deno test`: these files are assertion scripts with
      # their own harness rather than Deno.test() cases, so `deno test` reports
      # a misleading "0 passed" while still honouring their Deno.exit(1).
      # Running them directly makes the pass/fail count the real output.
      # Typechecking is deliberately left on — both files are clean.
      - name: vitals-import parser + cron guard
        run: deno run --allow-env vitals-import/test.ts
      - name: vitals-import-api client + mapper
        run: deno run --allow-env vitals-import-api/test.ts
      # Not auto-discovered: the steps in this job are hardcoded, so a new
      # function's tests run only once a step is added for them by hand.
      - name: strava-import mapper + state + tokens + cron guard
        run: deno run --allow-env strava-import/test.ts
