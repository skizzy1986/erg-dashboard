name: Names guard

# The app is SplitIQ (R34), and shipped code no longer names its first user
# (R35). This pins the old self-names out of every tracked file under web/ and
# .github/workflows/, and a first-person name out of web/src outside tests.
#
# A separate workflow, not a step in ci-web.yml: that workflow is path-filtered
# to web/** (ci-web.yml:35), so a guard there never fires on a change under
# .github/workflows/ alone. That is the failure no-llm-path.yml:8-11 and
# zone-bands.yml:10-14 record. Node builtins and git only, so no npm ci.
#
# Job-level path filtering, never workflow-level `on.paths`, for the reason
# ci-web.yml:3-7 gives: as a required check, a workflow that never triggers
# strands the PR on "Expected — waiting for status", while a skipped job
# passes. Not required until the check-run name below is added to the ruleset.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: names-guard-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect names guard inputs
    runs-on: ubuntu-latest
    outputs:
      scan: ${{ steps.filter.outputs.scan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            scan:
              - 'web/**'
              - '.github/workflows/**'

  check:
    name: No old self-names in web or workflows
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scan == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node web/scripts/check-names.mjs
