name: E2E — Web Smoke

# Playwright smoke tests: assert every dashboard tab mounts without error.
# Runs on PRs (and pushes to main) but is NOT a required check yet — it informs,
# it does not gate. The webServer in playwright.config.js builds the app with a
# stub Supabase config; the auth gate is satisfied by a seeded localStorage
# session, so no real backend is contacted.
#
# The job runs in the official Playwright container (browsers + OS deps baked
# in) instead of `npx playwright install --with-deps` every run. The image tag
# MUST match the @playwright/test version in web/package-lock.json, so it is
# READ FROM the lockfile by the `changes` job rather than hand-maintained — a
# hardcoded tag silently rotted every time Dependabot bumped the npm package
# (every smoke test then died on a missing browser binary).
#
# Path filtering is job-level (`changes` job + `if:`), not workflow-level
# `on.paths` — see the note in ci-web.yml for why (required-check safety).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      pw: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/e2e-web.yml'
      - id: pw
        name: Read Playwright version from the lockfile
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright Smoke
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.pw }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:e2e
        env:
          # Actions overrides HOME to /github/home inside containers; Playwright
          # expects the image's root home for its browser installs.
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
