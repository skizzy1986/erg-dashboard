name: E2E — Web

# Two Playwright suites, neither of them a required check — they inform, they do
# not gate:
#   - Playwright Smoke  — every dashboard tab mounts without error.
#   - Playwright Visual — screenshot baselines for the app shell (#249).
#
# The webServer in playwright.config.js builds the app with a stub Supabase
# config; the auth gate is satisfied by a seeded localStorage session (see
# e2e/fixtures.js), so no real backend is contacted.
#
# Both jobs run in the official Playwright container (browsers + OS deps baked
# in) instead of `npx playwright install --with-deps` every run. The image tag
# MUST match the @playwright/test version in web/package-lock.json, so it is
# READ FROM the lockfile by the `changes` job rather than hand-maintained — a
# hardcoded tag silently rotted every time Dependabot bumped the npm package
# (every smoke test then died on a missing browser binary).
#
# For the visual suite that pinning is load-bearing in a second way: glyph
# rasterisation differs between images, so a baseline generated anywhere other
# than this exact image fails forever. That is what the `Update Visual
# Baselines` job is for — run it from the Actions tab when a design change is
# meant to move pixels, download the artifact, commit the PNGs. A bump of
# @playwright/test can also require it.
#
# Path filtering is job-level (`changes` job + `if:`), not workflow-level
# `on.paths` — see the note in ci-web.yml for why (required-check safety).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Regenerate the visual baselines and upload them as an artifact'
        type: boolean
        default: false

concurrency:
  group: e2e-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      pw: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        # A manual run has no diff to filter on, and it only ever targets the
        # baseline job below — so the test jobs stay skipped.
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/e2e-web.yml'
      - id: pw
        name: Read Playwright version from the lockfile
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright Smoke
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.pw }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:e2e
        env:
          # Actions overrides HOME to /github/home inside containers; Playwright
          # expects the image's root home for its browser installs.
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  visual:
    name: Playwright Visual
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.pw }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:visual
        env:
          HOME: /root
      # Actual/expected/diff triplets for every failed comparison. The artifact
      # name must differ from the smoke job's — upload-artifact rejects a
      # duplicate name within a run, and both jobs write playwright-report/.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-visual-diff
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  visual-baselines:
    name: Update Visual Baselines
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.update_baselines
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.pw }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Rewriting a baseline reports the test as failed, which is not a failure
      # of this job — the regenerated PNGs still have to be uploaded.
      - run: npm run test:visual:update
        continue-on-error: true
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: web/e2e/visual.spec.js-snapshots/
          retention-days: 7
