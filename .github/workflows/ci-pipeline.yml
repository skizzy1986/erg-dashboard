name: CI — Pipeline

# Tests for the squat-anatomy Python pipeline (pipeline/squat-anatomy): the
# golden rebuild (decompressed data sha + parsed manifest == what /squat ships),
# per-stage byte pins and the no-exec guard. See its README "Test".
#
# Path filtering is at the JOB level via the `changes` job, never workflow-level
# `on.paths`, for the reason ci-web.yml:1-7 gives: a workflow that never
# triggers reports nothing and leaves a required check "Expected — waiting for
# status", whereas a job skipped by `if:` reports "skipped", which branch
# protection counts as passing.
#
# SQUAT_STRICT_STL=1 turns "STLs missing" from a skip into a failure, so a fetch
# that silently produced nothing cannot pass the golden test by skipping it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pipeline-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pipeline/squat-anatomy

jobs:
  changes:
    name: Detect pipeline changes
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            pipeline:
              - 'pipeline/squat-anatomy/**'
              - '.github/workflows/ci-pipeline.yml'

  test:
    name: Pipeline tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    timeout-minutes: 10
    env:
      SQUAT_STRICT_STL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/squat-anatomy/requirements*.txt
      # The STLs are fetched from a pinned BodyParts3D commit (scripts/fetch_stl.sh), so the
      # script's hash is a complete cache key; tests/test_inputs.py checks each file's sha256.
      - uses: actions/cache@v6
        with:
          path: pipeline/squat-anatomy/pipeline/ext/stl
          key: bp3d-stl-${{ hashFiles('pipeline/squat-anatomy/scripts/fetch_stl.sh') }}
      - run: pip install -r requirements-dev.txt
      - run: scripts/fetch_stl.sh
      - run: python -m pytest
      # The tests write only to tmp dirs; anything left in the tree means a stage wrote into pipeline/v3.
      - run: test -z "$(git status --porcelain)"
