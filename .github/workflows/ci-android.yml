name: CI — Android

# Path filtering is at the JOB level, never workflow-level `on.paths`, for the
# reason ci-web.yml:3-7 gives: a workflow that never triggers reports NOTHING,
# so as a required check it strands the PR on "Expected — waiting for status",
# whereas a job skipped by an `if:` reports "skipped", which branch protection
# counts as passing. zone-bands.yml was converted for the same reason.
#
# `push` is scoped to main — the same as every other workflow here — because a
# push glob over the branch prefixes we actually work on (claude/**, feature/**,
# fix/**) collided with `pull_request` in the concurrency group below: on a PR
# from one of those branches `github.head_ref` and `github.ref_name` resolve to
# the SAME string, so the pull_request run cancelled the push run for the same
# commit. That left CANCELLED check-runs on the head SHA under `Build Debug APK`
# (required) and `Build Web Assets`, which `gh pr checks` renders as "fail" — a
# red PR with nothing failing (PR #329, runs 33142558605 / 33142584769, 31s apart
# on 41b3b62, 2026-08-28; #330). Pre-merge cover is unchanged: the pull_request
# event still builds every PR, and it was the surviving run all along. Do not
# re-add the prefix globs without also making the concurrency group event-aware.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Android inputs
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            android:
              - 'web/android/**'
              - 'web/capacitor.config.json'
              - 'web/package.json'
              - 'web/src/**'
              - 'supabase/**'
              - '.github/workflows/ci-android.yml'

  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Build web app
        run: npm run build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [changes, build-web]
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist/
      # The public squat tool is web-only: the APK opens the dashboard and
      # never routes to /squat. Its data (2.2 MB) and its JS — the tool chunk,
      # the decode worker and the three.js scene (~140 KB gzip) — would ship
      # as dead weight. vite.config.js names every squat-only file squat-*,
      # and check-bundle-size.mjs fails the web build if that ever stops being
      # true, so one glob is the whole strip. RouteRoot's lazy import names
      # the tool chunk but never runs natively, and the service worker does
      # not precache any of them (globIgnores), so nothing fetches them.
      - name: Drop web-only squat chunks and data
        run: rm -f dist/assets/squat-*
        working-directory: web
      # The dashboard's Spanish catalogs are the opposite case: the APK ships
      # the dashboard, so it carries them and Spanish works offline. Both (the
      # boot catalog and, since i18n Phase 2a, the views catalog) are named
      # i18n-* (scripts/i18nChunks.mjs) and must survive the strip above, while
      # nothing squat-* may.
      - name: Assert the Spanish catalogs ship and squat does not
        run: |
          ls dist/assets/i18n-es-*.js
          count=$(ls dist/assets/i18n-es-*.js | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "expected both Spanish dashboard catalogs, found $count" >&2
            exit 1
          fi
          if ls dist/assets/squat-* 2>/dev/null; then
            echo "squat-* files are still in dist/assets" >&2
            exit 1
          fi
        working-directory: web
      - name: Sync Capacitor assets
        run: npx cap sync android
        working-directory: web
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: web/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: splitiq-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
