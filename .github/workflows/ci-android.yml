name: CI — Android

# Path filtering is at the JOB level, never workflow-level `on.paths`, for the
# reason ci-web.yml:3-7 gives: a workflow that never triggers reports NOTHING,
# so as a required check it strands the PR on "Expected — waiting for status",
# whereas a job skipped by an `if:` reports "skipped", which branch protection
# counts as passing. zone-bands.yml was converted for the same reason.
#
# `push` is scoped to main — the same as every other workflow here — because a
# push glob over the branch prefixes we actually work on (claude/**, feature/**,
# fix/**) collided with `pull_request` in the concurrency group below: on a PR
# from one of those branches `github.head_ref` and `github.ref_name` resolve to
# the SAME string, so the pull_request run cancelled the push run for the same
# commit. That left CANCELLED check-runs on the head SHA under `Build Debug APK`
# (required) and `Build Web Assets`, which `gh pr checks` renders as "fail" — a
# red PR with nothing failing (PR #329, runs 33142558605 / 33142584769, 31s apart
# on 41b3b62, 2026-08-28; #330). Pre-merge cover is unchanged: the pull_request
# event still builds every PR, and it was the surviving run all along. Do not
# re-add the prefix globs without also making the concurrency group event-aware.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Android inputs
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'web/android/**'
              - 'web/capacitor.config.json'
              - 'web/src/**'
              - 'supabase/**'
              - '.github/workflows/ci-android.yml'

  build-web:
    name: Build Web Assets
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Build web app
        run: npm run build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [changes, build-web]
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/
      - name: Sync Capacitor assets
        run: npx cap sync android
        working-directory: web
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: web/android
      - uses: actions/upload-artifact@v7
        with:
          name: erg-dashboard-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
