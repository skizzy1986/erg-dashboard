name: Post discussion

# Creates one GitHub Discussion, or one reply on an existing Discussion, from a
# dispatch.
#
# Cloud Claude Code sessions cannot write to Discussions themselves: GraphQL is
# blocked ("GitHub GraphQL is not available from Claude Code sessions") and the
# REST API has no write route (POST /repos/{owner}/{repo}/discussions is a 404;
# the list and each thread's comments are readable). They can dispatch a
# workflow, so this job makes the one GraphQL call on their behalf. See
# docs/CLOUD_ENVIRONMENT.md.
#
# This workflow cannot tell an approved post from an unapproved one. The
# approval rule lives with the caller: the weekly "SplitIQ Discussion drafts"
# scheduled task shows Scott the drafts and dispatches only on his reply.
#
# Two modes, chosen by `reply_to`:
#   empty      new Discussion: needs `category`, `title` and `body`
#   a number   reply on that Discussion: needs `body` only; `category` and
#              `title` are ignored. The reply is a top-level comment, which in
#              Q&A is what GitHub treats as an answer.
#
# Author: DISCUSSIONS_PAT, if that secret exists, posts as the token's owner.
# Without it the job falls back to GITHUB_TOKEN and the post is authored by
# github-actions[bot].
#
# `category` is a string, not a choice, and is checked against the live
# category slugs, so a renamed or added category needs no change here and a
# wrong slug fails with the list of valid ones. It is not `required`, because a
# reply has no category; the script checks it instead.
#
# A retried dispatch cannot post the same thing twice: a new Discussion is
# refused when its title matches one of the 50 newest, and a reply is refused
# when its body matches one of the thread's 50 newest comments.

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'new Discussion only. Category slug: announcements, ideas, show-and-tell, q-a'
        type: string
        required: false
      title:
        description: new Discussion only. The title
        type: string
        required: false
      body:
        description: body of the Discussion or of the reply (Markdown)
        type: string
        required: true
      reply_to:
        description: reply only. Number of the Discussion to reply on; leave empty to create a new Discussion
        type: string
        required: false
      dry_run:
        description: run every check, but do not post
        type: boolean
        required: false
        default: false

permissions:
  discussions: write

concurrency:
  group: post-discussion
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.DISCUSSIONS_PAT || github.token }}
      CATEGORY: ${{ inputs.category }}
      TITLE: ${{ inputs.title }}
      BODY: ${{ inputs.body }}
      REPLY_TO: ${{ inputs.reply_to }}
      DRY_RUN: ${{ inputs.dry_run }}
      REPO: ${{ github.repository }}
    steps:
      - name: Post
        run: |
          set -euo pipefail

          if [ -z "${BODY//[[:space:]]/}" ]; then
            echo "::error::body must be non-empty."
            exit 1
          fi

          if [ -n "$REPLY_TO" ]; then
            if ! [[ "$REPLY_TO" =~ ^[0-9]+$ ]]; then
              echo "::error::reply_to must be a Discussion number, got '$REPLY_TO'."
              exit 1
            fi

            if ! meta=$(gh api graphql \
              -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$REPLY_TO" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    discussion(number: $number) {
                      id
                      url
                      locked
                      comments(last: 50) { nodes { body url } }
                    }
                  }
                }'); then
              echo "::error::Could not read Discussion #$REPLY_TO. Is the number right?"
              exit 1
            fi

            discussion_id=$(jq -r '.data.repository.discussion.id // empty' <<<"$meta")
            if [ -z "$discussion_id" ]; then
              echo "::error::No Discussion with number $REPLY_TO."
              exit 1
            fi
            if [ "$(jq -r '.data.repository.discussion.locked' <<<"$meta")" = "true" ]; then
              echo "::error::Discussion #$REPLY_TO is locked."
              exit 1
            fi

            existing=$(jq -r --arg b "$BODY" '
              def trim: gsub("\r"; "") | gsub("^\\s+|\\s+$"; "");
              [.data.repository.discussion.comments.nodes[] | select((.body | trim) == ($b | trim)) | .url]
              | first // empty' <<<"$meta")
            if [ -n "$existing" ]; then
              echo "::error::This reply is already on the thread: $existing"
              exit 1
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: Discussion #$REPLY_TO found, not locked, no duplicate reply, nothing posted." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            url=$(gh api graphql \
              -f discussion="$discussion_id" -f body="$BODY" \
              -f query='
                mutation($discussion: ID!, $body: String!) {
                  addDiscussionComment(input: { discussionId: $discussion, body: $body }) {
                    comment { url }
                  }
                }' \
              --jq '.data.addDiscussionComment.comment.url')

            echo "Replied: $url" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${TITLE//[[:space:]]/}" ] || [ -z "${CATEGORY//[[:space:]]/}" ]; then
            echo "::error::A new Discussion needs category and title. To reply on an existing one, set reply_to."
            exit 1
          fi

          meta=$(gh api graphql \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" \
            -f query='
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  id
                  discussionCategories(first: 25) { nodes { id slug } }
                  discussions(first: 50, orderBy: { field: CREATED_AT, direction: DESC }) {
                    nodes { title url }
                  }
                }
              }')

          repo_id=$(jq -r '.data.repository.id' <<<"$meta")
          cat_id=$(jq -r --arg s "$CATEGORY" \
            '.data.repository.discussionCategories.nodes[] | select(.slug == $s) | .id' <<<"$meta")
          if [ -z "$cat_id" ]; then
            slugs=$(jq -r '[.data.repository.discussionCategories.nodes[].slug] | join(", ")' <<<"$meta")
            echo "::error::No category with slug '$CATEGORY'. Valid slugs: $slugs"
            exit 1
          fi

          existing=$(jq -r --arg t "$TITLE" \
            '[.data.repository.discussions.nodes[] | select(.title == $t) | .url] | first // empty' <<<"$meta")
          if [ -n "$existing" ]; then
            echo "::error::A discussion with this title already exists: $existing"
            exit 1
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: category '$CATEGORY' resolved, no duplicate title, nothing posted." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          url=$(gh api graphql \
            -f repo="$repo_id" -f cat="$cat_id" -f title="$TITLE" -f body="$BODY" \
            -f query='
              mutation($repo: ID!, $cat: ID!, $title: String!, $body: String!) {
                createDiscussion(input: { repositoryId: $repo, categoryId: $cat, title: $title, body: $body }) {
                  discussion { url }
                }
              }' \
            --jq '.data.createDiscussion.discussion.url')

          echo "Posted: $url" | tee -a "$GITHUB_STEP_SUMMARY"
