name: ✨ Feature
description: A new capability or enhancement to build
labels: ['P2']
body:
  - type: input
    id: outcome
    attributes:
      label: Outcome-shaped title check
      description: Restate the goal as an outcome, not a vibe ("Sync Strava activities into sessions", not "Strava stuff").
      placeholder: When this ships, the user can…
    validations:
      required: true
  - type: textarea
    id: what-why
    attributes:
      label: What and why
      description: What are we building, and why is it worth doing now?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist of observable conditions that mean "done".
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / context
      description: Affected files, training-science context (CTL/ATL, sessions/vitals), or links.
    validations:
      required: false
  - type: dropdown
    id: visual-impact
    attributes:
      label: Visual impact
      description: Does this change what the app looks like? See DESIGN.md.
      options:
        - None — no rendered change
        - Tokens only — colour or type token swap, no layout move
        - Layout — spacing, radius, or structure moves
        - New screen or component
    validations:
      required: true
